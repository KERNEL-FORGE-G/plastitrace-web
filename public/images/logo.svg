<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ptGradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="ptGradMint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ptGradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#021f14" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background circle glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Outer Track Ring (Dotted Cryptographic Ledger nodes) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#064e3b" stroke-width="3" stroke-dasharray="6 12" />
  
  <!-- Cryptographic hash block markers -->
  <circle cx="256" cy="56" r="7" fill="#34d399" />
  <circle cx="456" cy="256" r="7" fill="#10b981" />
  <circle cx="256" cy="456" r="7" fill="#059669" />
  <circle cx="56" cy="256" r="7" fill="#34d399" />

  <!-- Main Circular Polymer Loop 1 (Arrows of Circular Economy) -->
  <path d="M 256,96 C 344,96 416,168 416,256 C 416,290 405,321 386,346 L 358,322 C 372,303 380,280 380,256 C 380,187 325,132 256,132 L 256,164 L 196,114 L 256,64 Z" 
        fill="url(#ptGradMint)" filter="url(#shadowGlow)" />

  <!-- Main Circular Polymer Loop 2 (Interlocking reverse return loop) -->
  <path d="M 256,416 C 168,416 96,344 96,256 C 96,222 107,191 126,166 L 154,190 C 140,209 132,232 132,256 C 132,325 187,380 256,380 L 256,348 L 316,398 L 256,448 Z" 
        fill="url(#ptGradEmerald)" filter="url(#shadowGlow)" />

  <!-- Central Hexagonal Digital Block (Verification & Blockchain/Hash node) -->
  <polygon points="256,186 316,221 316,291 256,326 196,291 196,221" 
           fill="#032517" stroke="url(#ptGradMint)" stroke-width="7" stroke-linejoin="round" />

  <!-- Inner Polymer & Leaf Motif inside Hexagon -->
  <path d="M 256,210 C 275,230 286,255 275,275 C 265,290 245,292 236,280 C 226,268 230,240 256,210 Z" 
        fill="url(#ptGradMint)" />
  <path d="M 256,225 L 256,285" stroke="#022c1b" stroke-width="3" stroke-linecap="round" />
  <path d="M 256,245 L 270,238" stroke="#022c1b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 256,260 L 244,255" stroke="#022c1b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Connected Pulse Beads (Data Packets) -->
  <circle cx="316" cy="221" r="5" fill="#a7f3d0" />
  <circle cx="316" cy="291" r="5" fill="#a7f3d0" />
  <circle cx="196" cy="221" r="5" fill="#a7f3d0" />
  <circle cx="196" cy="291" r="5" fill="#a7f3d0" />
</svg>
